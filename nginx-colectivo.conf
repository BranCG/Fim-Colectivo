# Configuración de Nginx para Fim Colectivo en colectivo.fimchile.cl
# Este bloque es independiente y NO interfiere con Fim principal ni MC Simulator.

server {
    listen 80;
    server_name colectivo.fimchile.cl;

    client_max_body_size 20M;

    # 1. Frontend Web (Next.js en puerto 3010)
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend API (Node.js Express en puerto 3011)
    location /api/ {
        proxy_pass http://127.0.0.1:3011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. WebSockets en tiempo real (Socket.io en puerto 3011)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3011/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Archivos multimedia y uploads
    location /uploads/ {
        proxy_pass http://127.0.0.1:3011/uploads/;
        proxy_set_header Host $host;
    }
}
