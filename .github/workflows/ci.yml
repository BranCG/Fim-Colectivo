name: CI - Integración Continua

on:
  push:
    branches: [ main, dev, DevOpS ]
  pull_request:
    branches: [ main, dev, DevOpS ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalación de dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generar cliente de Prisma
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

      - name: Compilación del Monorepo
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          NEXT_PUBLIC_API_URL: "https://colectivo.fimchile.cl"
          JWT_SECRET: "ci-secret-key"
          JWT_REFRESH_SECRET: "ci-refresh-secret"
