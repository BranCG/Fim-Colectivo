name: CD - Despliegue Continuo AWS

on:
  push:
    branches: [ main]

concurrency:
  group: fim-colectivo-production
  cancel-in-progress: false

jobs:
  build-check:
    name: Validar Compilación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalación de dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generar cliente de Prisma
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

      - name: Compilar Monorepo
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          NEXT_PUBLIC_API_URL: "https://colectivo.fimchile.cl"
          JWT_SECRET: "ci-secret-key"
          JWT_REFRESH_SECRET: "ci-refresh-secret"

      - name: Verificar reservas y cupos
        run: npm run test --workspace=apps/api

      - name: Verificar tipos de la aplicación
        run: |
          npx tsc --noEmit --incremental false -p apps/web/tsconfig.json
          npx tsc --noEmit --incremental false -p apps/admin/tsconfig.json

  deploy:
    name: Desplegar en Servidor AWS
    runs-on: ubuntu-latest
    needs: [build-check]

    steps:
      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -eu
            APP_DIR="/var/www/fim-colectivo"
            cd "$APP_DIR"
            if [ "$(git branch --show-current)" != "main" ]; then
              echo "Despliegue detenido: configura la copia del servidor en main antes de continuar."
              exit 1
            fi
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Despliegue detenido: hay cambios locales en archivos versionados del servidor."
              exit 1
            fi
            echo "Commit anterior: $(git rev-parse HEAD)"
            git fetch origin main
            git merge --ff-only '${{ github.sha }}'
            test "$(git rev-parse HEAD)" = '${{ github.sha }}'

            docker compose up -d --build api web
            ready=false
            for attempt in $(seq 1 12); do
              if docker compose exec -T api node -e "fetch('http://127.0.0.1:3011/api/health', {signal: AbortSignal.timeout(5000)}).then(r => r.json()).then(s => process.exit(s.status === 'ok' && s.database === 'connected' ? 0 : 1)).catch(() => process.exit(1))" && curl --fail --silent --max-time 5 --output /dev/null http://127.0.0.1:3010/; then
                ready=true
                break
              fi
              sleep 5
            done
            test "$ready" = true
            echo "API y web disponibles. Commit desplegado: $(git rev-parse HEAD)"
